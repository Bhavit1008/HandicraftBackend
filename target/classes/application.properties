spring.data.mongodb.database=${MONGODB_DATABASE:handicraft_backend}

# Render injects PORT; 8080 locally.
server.port=${PORT:8080}

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Timezone used to decide which day a coaster stock change belongs to.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:<cloudinary-cloud-name>}
cloudinary.api-key=${CLOUDINARY_API_KEY:<cloudinary-api-key>}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:<cloudinary-api-secret>}

# VAPID keys for Web Push notifications — generate with: npx web-push generate-vapid-keys
# Push notifications are disabled while these are left blank.
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:you@example.com}
